name: sdk-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo to lint, test, and build.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (SDK + dev)
        working-directory: repo
        run: uv sync --all-extras --dev

      - name: Ruff lint
        working-directory: repo
        run: uv run ruff check .

      - name: Ruff format --check
        working-directory: repo
        run: uv run ruff format --check .

      - name: Offline unit tests with coverage
        working-directory: repo
        # --cov-fail-under=40: floor based on measured ~42% on offline suite; TODO raise as coverage improves
        run: |
          uv run pytest tests/unit/ tests/sdk/ -m "not deployed" \
            --cov=agentic_evaluation --cov-report=term-missing \
            --cov-fail-under=40 \
            -v --tb=short

      - name: agentic-eval CLI smoke
        working-directory: repo
        run: uv run agentic-eval --help

  build-wheel:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build sdist + wheel
        working-directory: repo
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: repo/dist/
